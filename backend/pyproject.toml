[project]
name = "stackchan-backend"
version = "0.1.0"
description = "PC-side AI backend for the StackChan CoreS3 AI Bot (FastAPI / Clean Architecture + DDD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    # OpenAI-compatible AgentGateway transport (infrastructure/agent).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Optional native deps for the WS audio path (Issue #7). Neither is required
# for `make check`: the codec/recognizer are lazy-loaded and tests use fakes.
# Uplink Opus decode (libopus binding). Requires libopus on the host.
opus = [
    "opuslib>=3.0",
]
# sherpa-onnx ASR. Models are a separate download (paths via settings).
sherpa = [
    "sherpa-onnx>=1.10",
]
# OpenCV face detection (Issue #8). Not required for `make check`: the
# recognizer is lazy-loaded and tests use a fake. numpy is pulled in by opencv.
vision = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]
# Irodori-TTS downlink synthesis (ADR-0006). Heavy: PyTorch + a HF checkpoint
# (separate download, paths via settings). Lazy-loaded; not needed for tests.
# The Irodori-TTS package itself is installed from source/HF (not on PyPI), see
# app/infrastructure/tts/irodori_tts_synthesizer.py; this extra pulls the heavy
# runtime (torch). transformers is needed to load the HF checkpoint.
tts = [
    "torch>=2.2",
    "transformers>=4.40",
]

[tool.uv]
# dev dependencies are installed by `uv sync --extra dev` (see Makefile)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E,W), isort(I), pyupgrade(UP), bugbear(B), comprehensions(C4)
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
